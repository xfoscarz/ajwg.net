        <style>
            @font-face {
                font-family: "Epilogue";
                src: url("Epilogue.ttf") format("truetype");
            }

            :root {
                font-family: "Epilogue";
                font-weight: 200;
            }

            html, body {
                width: 100vw;
                height: 100vh;
                margin: 0px;
                padding: 0px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            span {
                font-size: 5em;
                display: block;
                text-align: center;
            }

            a {
                color: #0000ff;
                text-decoration: none;
                font-size: 2em;
                padding: 50px;
            }

            a:hover {
                text-decoration: underline;
            }

            a.hidden {
                content: "who";
                position: absolute;
                left: 0px;
                padding: 0px;
                font-size: 5rem;
                color: #000000;
            }

            a.hidden {
                position: relative;
                opacity: 1;
                
                border-bottom: 5px solid #00000000;
            }
            
            a.hidden::after {
                transform: translateY(-0.25em);
                border-bottom: 5px solid #00000000;
                transition: border-bottom 1s cubic-bezier(1,0,1,0);
            }

            a.hidden::after:hover {
                border-bottom: 5px solid #007fff;
                text-decoration: none;
            }

            @media screen and (max-width: 700px) {
                span {
                    width: 100vw;
                }
            }
        </style>

        <style>
            .shameless-plug {
                position: absolute;
                width: fit-content;
                bottom: 1em;
            }

            .shameless-plug * {
                display: inline-block;
                font-size: 1rem;
                padding: 0px;
                width: fit-content;
            }
        </style>
    </head>

    <body>
        <span>

        </div>
    </body>
</html>
